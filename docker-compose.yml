# TrendRadar API + PostgreSQL
# Çalıştırma: docker compose up --build   →   http://127.0.0.1:8000/docs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trendradar
      POSTGRES_PASSWORD: trendradar
      POSTGRES_DB: trendradar
    volumes:
      # Veriler konteyner silinse de kalır (tamamen sıfırlamak için: docker compose down -v)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendradar -d trendradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      # Mock mod: cookie gerekmez, sahte ama tutarlı veri üretir
      TRENDS_MODE: mock
      DATABASE_URL: postgresql+psycopg://trendradar:trendradar@db:5432/trendradar
    ports:
      # Yalnızca bu makineden erişilir; farklı port için: API_PORT=9000 docker compose up
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      # Veritabanı bağlantı kabul etmeden API başlatılmaz
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    # --- Live mod (gerçek Google Trends) ---
    # 1) Yukarıdaki TRENDS_MODE değerini "live" yapın
    # 2) cookies.json dosyasını proje köküne koyun ve aşağıdaki satırların başındaki # işaretini kaldırın
    #    Dosya salt-okunur bağlanır ve imaja kopyalanmaz; asla commit etmeyin
    # volumes:
    #   - ./cookies.json:/app/cookies.json:ro

volumes:
  pgdata:
